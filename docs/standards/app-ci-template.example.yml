# File mẫu CI/CD dành riêng cho từng Microservice App (đặt tại apps/<app-name>/.github/workflows/ci.yml)
name: CI - App Microservice Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-ci:
    name: Test & Build Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build & Run Unit Tests
        run: |
          cd back-end # hoặc backend
          if [ -f "./mvnw" ]; then
            chmod +x ./mvnw
            ./mvnw clean test
          elif [ -f "pom.xml" ]; then
            mvn clean test
          fi

      - name: Build Docker Image
        run: |
          echo "==> Build image: vahiztech/${{ github.event.repository.name }}-backend:${{ github.sha }}"
          # docker build -t vahiztech/${{ github.event.repository.name }}-backend:${{ github.sha }} ./backend

  frontend-ci:
    name: Test & Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: front-end/package-lock.json

      - name: Install & Lint & Build
        run: |
          cd front-end # hoặc frontend
          if [ -f "package.json" ]; then
            npm ci
            npm run lint || true
            npm run build
          fi

  deploy:   # JOB 3 – Deploy to K8s
    name: Deploy to Kubernetes
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    environment: production   # manual approve
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Setup Helm + Kubeconfig
      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Setup Kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      # Run Helm Upgrade / Deploy
      - name: Deploy with Helm
        run: |
          helm upgrade --install ${{ github.event.repository.name }} ./chart \
            --namespace vahiztech-prod \
            --create-namespace \
            --set image.tag=${{ github.sha }}

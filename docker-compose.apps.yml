# Quản lý các microservices
services:
  coursedemy-backend:
    build:
      context: ./apps/coursedemy/back-end
      dockerfile: Dockerfile
    container_name: vahiztech-coursedemy-backend
    restart: unless-stopped
    ports:
      - "${COURSEDEMY_BACKEND_PORT:-8081}:8080"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/coursedemy_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-keycloak}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-keycloak_secure_pass_2026}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/ecosystem-realm/protocol/openid-connect/certs
      JWT_SECRET: ${JWT_SECRET:-ZGV2LW9ubHktY291cnNlZGVteS1qd3Qtc2VjcmV0LTEyMzQ1Ng==}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}

  coursedemy-frontend:
    build:
      context: ./apps/coursedemy/front-end
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_COURSEDEMY_API:-http://localhost:8081}
    container_name: vahiztech-coursedemy-frontend
    restart: unless-stopped
    ports:
      - "${COURSEDEMY_FRONTEND_PORT:-3001}:3000"
    environment:
      AUTH_SECRET: ${AUTH_SECRET:-vahiztech-dev-secret-auth-key-2026}
      AUTH_URL: http://localhost:3001
      NEXTAUTH_URL: http://localhost:3001
      BACKEND_INTERNAL_URL: http://coursedemy-backend:8080
      NEXT_PUBLIC_API_URL: http://localhost:8081
    depends_on:
      - coursedemy-backend

  vihotask-backend:
    build:
      context: ./apps/vihotask/backend
      dockerfile: Dockerfile
    container_name: vahiztech-vihotask-backend
    restart: unless-stopped
    ports:
      - "${VIHOTASK_BACKEND_PORT:-8083}:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/vihotask_db
      DB_USER: ${POSTGRES_USER:-keycloak}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-keycloak_secure_pass_2026}
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/vihotask_db
      QUARKUS_DATASOURCE_USERNAME: ${POSTGRES_USER:-keycloak}
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-keycloak_secure_pass_2026}
      QUARKUS_HTTP_PORT: 8080
      QUARKUS_HTTP_HOST: 0.0.0.0
      JWT_SECRET: ${JWT_SECRET:-ZGV2LW9ubHktdmlob3Rhc2stand0LXNlY3JldC0xMjM0NTY=}
    depends_on:
      postgres:
        condition: service_healthy

  vihotask-frontend:
    build:
      context: ./apps/vihotask/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_VIHOTASK_API:-http://localhost:8083}
    container_name: vahiztech-vihotask-frontend
    restart: unless-stopped
    ports:
      - "${VIHOTASK_FRONTEND_PORT:-3002}:3000"
    environment:
      AUTH_SECRET: ${AUTH_SECRET:-vahiztech-dev-secret-auth-key-2026}
      AUTH_URL: http://localhost:3002
      NEXTAUTH_URL: http://localhost:3002
      BACKEND_INTERNAL_URL: http://vihotask-backend:8080
      NEXT_PUBLIC_API_URL: http://localhost:8083
    depends_on:
      - vihotask-backend

  payment-hub:
    build:
      context: ./apps/payment-hub
      dockerfile: Dockerfile
    container_name: vahiztech-payment-hub
    restart: unless-stopped
    ports:
      - "${PAYMENT_HUB_PORT:-8084}:8084"
    environment:
      SPRING_DATASOURCE_URL: ${PAYMENT_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/payment_hub_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-keycloak}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-keycloak_secure_pass_2026}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 8084
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  default:
    name: vahiztech_net

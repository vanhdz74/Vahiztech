name: Maintenance - Sync Git Submodules

on:
  schedule:
    - cron: '0 2 * * *' # Chạy định kỳ lúc 2h sáng
  workflow_dispatch:

jobs:
  update-submodules:
    name: Check and Update Submodules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Hub Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: true
          fetch-depth: 0

      - name: Update Submodules to Latest Remote Commits
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git submodule update --remote --merge
          
          if ! git diff-index --quiet HEAD --; then
            echo "==> Có thay đổi mới trong submodules, tạo commit..."
            git commit -am "chore(deps): auto-update git submodules [skip ci]"
            git push origin main
          else
            echo "==> Tất cả submodules đã ở commit mới nhất!"
          fi

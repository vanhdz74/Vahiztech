name: CI/CD - Build & Deploy Keycloak IAM

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'infra/keycloak/**'
      - '.github/workflows/ci-cd-keycloak.yml'
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công trên GitHub UI

jobs:
  build-and-push-dockerhub:
    name: Build & Push Keycloak Image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/vahiztech-iam
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=ref,event=branch

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./infra/keycloak
          file: ./infra/keycloak/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-server:
    name: Deploy to Server / Kubernetes
    needs: build-and-push-dockerhub
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' # Chỉ tự động deploy khi push vào nhánh main

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # KỊCH BẢN A: NẾU DEPLOY LÊN KUBERNETES CLUSTER (K8S)
      - name: Deploy to Kubernetes Cluster (Optional)
        if: env.KUBECONFIG_DATA != ''
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          
          # Cập nhật image tag mới nhất trong K8s deployment
          kubectl set image deployment/keycloak keycloak=${{ secrets.DOCKERHUB_USERNAME }}/vahiztech-iam:${{ github.sha }} -n vahiztech || kubectl apply -k k8s/overlays/prod
          kubectl rollout status deployment/keycloak -n vahiztech --timeout=180s

      # KỊCH BẢN B: NẾU DEPLOY LÊN SERVER VPS (SSH + DOCKER COMPOSE)
      - name: Deploy to VPS via SSH (Optional)
        if: env.SERVER_HOST != ''
        uses: appleboy/ssh-action@v1.0.3
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd /path/to/Vahiztech
            git pull origin main
            docker compose -f docker-compose.infra.yml pull keycloak
            docker compose -f docker-compose.infra.yml up -d
            echo "[+] Keycloak IAM deployed successfully on VPS!"

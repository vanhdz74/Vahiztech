# Đặt tên
name: CI/CD - Build & Deploy Keycloak IAM

on:
  push:
    branches: [main, develop]
    paths:
      - "infra/keycloak/**"
      - ".github/workflows/ci-cd-keycloak.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Job 1
  build-and-push:
    name: Build & Push Keycloak Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Đăng nhập GitHub Container Registry (Tự động 100%)
      - name: Log in to GitHub Packages (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Đăng nhập Docker Hub (Hỗ trợ cả DOCKER_USERNAME / DOCKERHUB_USERNAME và DOCKER_TOKEN / DOCKERHUB_TOKEN)
      - name: Log in to Docker Hub (Optional)
        if: env.DOCKER_USER != '' && env.DOCKER_PASS != ''
        uses: docker/login-action@v3
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKER_TOKEN || secrets.DOCKERHUB_TOKEN }}
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ env.DOCKER_PASS }}

      - name: Setup Repository Names
        id: repo_name
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
          echo "DOCKER_USER_VAL=${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}" >> $GITHUB_ENV

      - name: Extract Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ env.REPO_LOWER }}-iam
            ${{ env.DOCKER_USER_VAL != '' && format('{0}/vahiztech-iam', env.DOCKER_USER_VAL) || '' }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=ref,event=branch

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./infra/keycloak
          file: ./infra/keycloak/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy: # JOB 3 – Deploy to K8s
    name: Deploy to Kubernetes
    needs: [build-and-push]
    runs-on: ubuntu-latest
    environment: production # manual approve
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Setup Helm + Kubeconfig
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Set up Kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      # Run Helm upgrade / install
      - name: Run Helm Upgrade / Deploy to K8s
        run: |
          if [ -d "./chart" ]; then
            helm upgrade --install vahiztech-iam ./chart \
              --namespace vahiztech-prod \
              --create-namespace \
              --set image.tag=${{ github.sha }}
          else
            echo "==> Áp dụng cấu hình K8s Production (Kustomize)..."
            kubectl apply -k k8s/overlays/prod --validate=false
            kubectl rollout status deployment/keycloak -n vahiztech-prod --timeout=180s || true
          fi

name: CI/CD - Build & Deploy Keycloak IAM

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'infra/keycloak/**'
      - '.github/workflows/ci-cd-keycloak.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Keycloak Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Đăng nhập GitHub Container Registry (Tự động 100%)
      - name: Log in to GitHub Packages (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Đăng nhập Docker Hub (Hỗ trợ cả DOCKER_USERNAME / DOCKERHUB_USERNAME và DOCKER_TOKEN / DOCKERHUB_TOKEN)
      - name: Log in to Docker Hub (Optional)
        if: env.DOCKER_USER != '' && env.DOCKER_PASS != ''
        uses: docker/login-action@v3
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKER_TOKEN || secrets.DOCKERHUB_TOKEN }}
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ env.DOCKER_PASS }}

      - name: Setup Repository Names
        id: repo_name
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
          echo "DOCKER_USER_VAL=${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}" >> $GITHUB_ENV

      - name: Extract Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ env.REPO_LOWER }}-iam
            ${{ env.DOCKER_USER_VAL != '' && format('{0}/vahiztech-iam', env.DOCKER_USER_VAL) || '' }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=ref,event=branch

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./infra/keycloak
          file: ./infra/keycloak/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-server:
    name: Deploy to Server / Kubernetes
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # KỊCH BẢN A: NẾU DEPLOY LÊN KUBERNETES CLUSTER (K8S)
      - name: Deploy to Kubernetes Cluster
        if: env.KUBECONFIG_DATA != ''
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

          echo "==> Kiểm tra kết nối tới K8s Cluster API..."
          if ! kubectl cluster-info --request-timeout=15s; then
            echo "::warning::Không thể kết nối trực tiếp tới K8s API Server (timeout/firewall). Bạn có thể dùng ArgoCD hoặc chạy lệnh kubectl apply thủ công trên server."
            exit 0
          fi

          echo "==> Đang áp dụng cấu hình K8s Production..."
          kubectl apply -k k8s/overlays/prod --validate=false
          kubectl rollout status deployment/keycloak -n vahiztech-prod --timeout=180s || true

      # KỊCH BẢN B: NẾU DEPLOY LÊN SERVER VPS (SSH + DOCKER COMPOSE)
      - name: Deploy to VPS via SSH
        if: env.SERVER_HOST != ''
        uses: appleboy/ssh-action@v1.0.3
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd /path/to/Vahiztech
            git pull origin main
            docker compose -f docker-compose.infra.yml pull keycloak
            docker compose -f docker-compose.infra.yml up -d
            echo "[+] Keycloak IAM deployed successfully on VPS!"

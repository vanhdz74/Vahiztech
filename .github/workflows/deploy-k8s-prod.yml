name: CD - Deploy to Kubernetes (Production)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: 'Xác nhận deploy lên Production (gõ YES để xác nhận)'
        required: true
        default: 'NO'

jobs:
  deploy-prod:
    name: Deploy to Production Cluster
    runs-on: ubuntu-latest

    steps:
      - name: Verify Confirmation
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.confirm_deploy }}" != "YES" ]; then
            echo "[-] Hủy deploy: Bạn chưa xác nhận YES!"
            exit 1
          fi

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_PROD || secrets.KUBECONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
        if: env.KUBECONFIG_DATA != ''
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_PROD || secrets.KUBECONFIG }}

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Deploy to K8s Production Environment
        run: |
          if [ -z "${{ secrets.KUBECONFIG_PROD || secrets.KUBECONFIG }}" ]; then
            echo "==> [SIMULATION / DRY RUN] Render manifests cho K8s Prod..."
            kustomize build k8s/overlays/prod
          else
            echo "==> Kiểm tra kết nối K8s Cluster..."
            if ! kubectl cluster-info --request-timeout=15s; then
              echo "::warning::Không thể kết nối trực tiếp tới K8s API Server (timeout/firewall). Bỏ qua deploy tự động."
              exit 0
            fi
            echo "==> [APPLY MODE] Áp dụng cấu hình lên K8s Production Cluster..."
            kubectl apply -k k8s/overlays/prod --validate=false
            kubectl rollout status deployment/coursedemy-backend -n vahiztech-prod --timeout=300s || true
            kubectl rollout status deployment/coursedemy-frontend -n vahiztech-prod --timeout=300s || true
            kubectl rollout status deployment/vihotask-backend -n vahiztech-prod --timeout=300s || true
          fi

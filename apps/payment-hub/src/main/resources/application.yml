server:
  port: ${PORT:8084}
  servlet:
    context-path: /

spring:
  application:
    name: payment-hub
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Cấu hình Datasource PostgreSQL
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/payment_hub_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  # Cấu hình Hibernate / JPA (Tuân thủ Flyway migration)
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public

  # Cấu hình Flyway Database Migration
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true

  # Cấu hình Redis Cache & Distributed Lock
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms
      connect-timeout: 5000ms

  # Cấu hình Apache Kafka Producer
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false

# Cấu hình Topics trong hệ sinh thái
ecosystem:
  kafka:
    topics:
      payment-events: ${KAFKA_PAYMENT_EVENTS_TOPIC:ecosystem.payment.events}

# Cấu hình Giám sát Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,flyway
  endpoint:
    health:
      show-details: always

# Cấu hình Tài liệu OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# Cấu hình Đơn vị Tiền tệ & Nhà cung cấp mặc định
payment:
  default-currency: VND
  qr-expiration-minutes: 15
  webhook:
    signature-secret: ${WEBHOOK_SECRET:vahiztech-payment-webhook-secret-2026}

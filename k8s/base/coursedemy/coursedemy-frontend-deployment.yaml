apiVersion: apps/v1
kind: Deployment
metadata:
  name: coursedemy-frontend
  namespace: vahiztech
  labels:
    app.kubernetes.io/name: coursedemy-frontend
    app.kubernetes.io/part-of: coursedemy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: coursedemy-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coursedemy-frontend
    spec:
      containers:
        - name: frontend
          image: vahiztech/coursedemy-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: vahiztech-secrets
                  key: COURSEDEMY_AUTH_SECRET
            - name: BACKEND_INTERNAL_URL
              value: http://coursedemy-backend:8080
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3

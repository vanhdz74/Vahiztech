apiVersion: apps/v1
kind: Deployment
metadata:
  name: coursedemy-backend
  namespace: vahiztech
  labels:
    app.kubernetes.io/name: coursedemy-backend
    app.kubernetes.io/part-of: coursedemy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: coursedemy-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coursedemy-backend
    spec:
      containers:
        - name: backend
          image: vahiztech/coursedemy-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/coursedemy_db
            - name: SPRING_DATASOURCE_USERNAME
              value: keycloak
            - name: SPRING_DATASOURCE_PASSWORD
              value: keycloak_secure_pass_2026
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
              value: http://keycloak:8080/realms/ecosystem-realm/protocol/openid-connect/certs
            - name: JWT_SECRET
              value: ZGV2LW9ubHktY291cnNlZGVteS1qd3Qtc2VjcmV0LTEyMzQ1Ng==
            - name: FRONTEND_URL
              value: http://localhost:3000
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3

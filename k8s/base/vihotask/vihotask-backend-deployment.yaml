apiVersion: apps/v1
kind: Deployment
metadata:
  name: vihotask-backend
  namespace: vahiztech
  labels:
    app.kubernetes.io/name: vihotask-backend
    app.kubernetes.io/part-of: vihotask
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vihotask-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vihotask-backend
    spec:
      containers:
        - name: backend
          image: vahiztech/vihotask-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/vihotask_db
            - name: SPRING_DATASOURCE_USERNAME
              value: keycloak
            - name: SPRING_DATASOURCE_PASSWORD
              value: keycloak_secure_pass_2026
            - name: PORT
              value: "8080"
            - name: JWT_SECRET
              value: ZGV2LW9ubHktdmlob3Rhc2stand0LXNlY3JldC0xMjM0NTY=
            - name: SPRING_PROFILES_ACTIVE
              value: uat
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
